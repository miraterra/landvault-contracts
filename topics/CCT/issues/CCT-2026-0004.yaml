    title: Write addendum mapping provider-driven (data-product) boundaries per ADR-0060/0062
    status: open
    priority: must-have
  - id: t2
    title: Write addendum mapping negotiated boundaries per ADR-0060/0062
    status: open
    priority: must-have
  - id: t3
    title: Attach addendum to or incorporate it into the framework standard (CCT-2026-0003)
    status: open
    priority: must-have
