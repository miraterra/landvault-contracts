id: CCT-2026-0013
date: '2026-07-07'
status: open

impact: high
impact_note: >
  This is the actual contract that closes the gap the whole
  mt-landvault-api BFF-extraction initiative (plan-2026-0001) is about:
  today mt-landvault-api sources data directly from Supabase/RDS/S3 with
  no contract at all governing that boundary. This issue gives it one.

  SCOPE AMENDED 2026-07-10 (David): rigor upgraded from deliberately-light
  (diff-on-change only) to FULL Level-1/Level-2 conformance machinery —
  this files the widen that the bff-extraction brief recorded as "issue
  update to file via cage on request".

  SCOPE AMENDED 2026-07-11 (Thinker architecture review, David sign-off):
  mt-landvault-temp is the ANALYTICAL system in a three-system model
  (landvault-backend = operational source of truth; mt-landvault-api =
  BFF). Its contract surface is five capabilities — catalogue, prediction,
  analytes, correlations, suitability match-counts — with regions,
  histogram, and all screen-shaped logic excluded (see what_to_resolve
  items 6-7). The initiative brief in landvault-management
  (projects/bff-extraction/) carries the full design record.

focus: mt-landvault-temp-contract
facet: implementation
classification: standard
initiative: contract-conformance-testing

title: >
  Publish mt-landvault-temp's provider-owned OpenAPI contract in
  landvault-contracts

description: >
  Per ADR-0060, the mt-landvault-temp (provider) to mt-landvault-api
  (consumer) boundary is provider-driven: the provider authors and owns
  the interface. mt-landvault-temp should generate its own OpenAPI spec
  from its actual implementation — mirroring how mt-landvault-api already
  does this for its own consumer-facing contract via
  scripts/generate-swagger.sh and swag annotations — not have the spec
  hand-authored by mt-landvault-api-side agents guessing at shape.

  That generated spec is published into a new contracts/ directory in
  this repo (landvault-contracts), giving it the same durable,
  independently-owned home the Discover Pod contract has (ADR-0057),
  scoped deliberately light given mt-landvault-temp's explicitly temporary
  status (mt-landvault-api plan-2026-0001, DATA-2026-0087): a plain
  generated spec plus a simple diff-on-change check, not the full
  four-surface conformance machinery (verify-spec/level1/level2/consumer
  contract test) that contracts/discover-pod/ has. Standing up that full
  machinery for a service you plan to hand off and restructure is
  premature; it can be added later if mt-landvault-temp's boundary
  outlives its temporary status.

  This supersedes the "where does mt-landvault-temp's contract live"
  question left open in mt-landvault-api's DATA-2026-0085 ("Write a
  minimal API contract for mt-landvault-temp") — the answer is: generated
  in mt-landvault-temp, published here.

notes: >
  Mandatory pre-reads: ADR-0060 (provider authors the interface), ADR-0057
  (independent contract ownership pattern this reuses at reduced scope).
  Companion issue: CCT-2026-0012 (the addendum documenting this as the
  provider-driven worked example) — write that from what actually gets
  built here, not ahead of it.

  Depends on mt-landvault-api DATA-2026-0082 (stand up mt-landvault-temp)
  existing before there is anything to generate a spec from.

  (STALE as of 2026-07-11 — retained for history:) Consumed by
  mt-landvault-api DATA-2026-0072 (regions delivery model, reactivated
  2026-07-07): its t3 ("implement a mt-landvault-temp endpoint that
  resolves and returns the current PMTiles tileset URL") was the concrete
  endpoint this issue's t1/t2 would publish the contract for. DATA-2026-
  0072 was re-reversed 2026-07-11: regions stays a BFF-served binary
  stream, temp has no regions/tileset endpoint, and 0072's t3-t5 are
  cancelled. No regions capability appears in this contract.

what_to_resolve: >
  (Scope amended 2026-07-10 and 2026-07-11 — see impact_note.)

  1. mt-landvault-temp generates its own OpenAPI spec from its
     implementation (reusing the swag-based approach already proven in
     mt-landvault-api, or an equivalent for whatever mt-landvault-temp is
     built in).
  2. The generated spec is published into a new contracts/<name>/
     directory in this repo (name TBD at authoring time — e.g.
     contracts/mt-landvault-temp/).
  3. mt-landvault-api is documented as the (currently sole) verified
     consumer.
  4. The boundary carries FULL conformance machinery — a diff-on-change
     guard PLUS Level-1/Level-2 verification (verify-spec + conformance
     tests). UPGRADED from the original deliberately-light scope by
     David's decision 2026-07-10; the light-scope rationale below is
     retained as history, not current policy.
  5. mt-landvault-api's DATA-2026-0085 is updated to point here instead of
     describing an internally-generated-only contract. (Done 2026-07-11 on
     mt-landvault-api PR #136.)
  6. (2026-07-11 architecture review) The contract surface is the FIVE
     analytical capabilities of the seam design: catalogue (analyte ids +
     valueRanges + governed K/M/K' thresholds), prediction (filtered/
     paginated rows), analytes (per-source measured/predicted county
     stats, suppression applied), correlations (+ MLRA resolution), and
     suitability MATCH-COUNTS (totalFields/matchingFields per county — no
     composite score). Explicitly NOT in temp's contract: regions/tiles
     (stays a BFF capability; DATA-2026-0072 re-reversed), histogram
     (retired), and all screen-shaped logic (RYG ratingThresholds,
     filterSteps, composite suitability score, measured/predicted "both"
     fusion — BFF-side per DATA-2026-0083).
  7. (2026-07-11) Consumer-contract coordination: mt-landvault-api's
     shell-facing contract gains /areal/v1/* paths (dual-run migration,
     response shapes identical). That change lives in the discover-pod
     contract space — coordinate with the active CCT-2026-0014 /
     iteration-2026-07 work so the two edits don't collide.

affects:
  - contracts/mt-landvault-temp/   # new — name TBD
  - README.md   # document the deliberately-light scope for this boundary

