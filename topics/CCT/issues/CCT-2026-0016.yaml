what_to_resolve: >-
  The discover-pod consumer contract (consumer-openapi.yaml), coverage-matrix.md, and
  verify-consumer-openapi.mjs are updated to match the REAL merged mt-landvault-api backend (main @
  8f5fac6 / PR #148 @ 257f720) on both: (A) the analytes `scale` query parameter default (add
  `default: absolute` to match the provider), and (B) the inverse-targeting clause shape (snake_case
  field names, no `direction` field, `computed_thresholds`/`target_match_percent` replacing
  top-level `solvedThreshold`, new `analyteAverages`/`nonMatchingAnalyteAverages`, and residue
  documentation reflecting the real first-wins multiplicity behavior instead of an unimplemented
  rejection rule). Contract version bumped. `make verify-spec` passes. `make level1` run locally
  against the real provider spec shows the two identified drifts resolved. David reviews and
  freezes; lands via PR to contracts main.
impact: critical
impact_note: >-
  Confirmed BLOCKING: landvault-shell PR #256 (initiative/iteration-2026-07) has a failing Level-1
  Contract Gate (gh run 29356475683, 2026-07-14), which per ADR-0058 is a hard automated gate with
  no implicit bypass — it blocks this PR (and the whole iteration-2026-07 shell integration branch)
  from reaching staging/main until reconciled.
