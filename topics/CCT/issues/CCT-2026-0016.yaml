      SuitabilityRequest.example (currently shows camelCase
      fieldMatchPercent/fieldOptimized/direction) must be rewritten to the new field names/shape;
      the /areal/suitability 400-response description currently states '>1 fieldOptimized:true
      clause MUST be rejected' -- rewrite to describe the real
      first-wins/silently-unsolved-for-duplicates behavior instead.
    status: open
    priority: must-have
    type: fix
  - id: t8
    description: >-
      Run make verify-spec and make level1 (PROVIDER_SPEC pointed at the real mt-landvault-api
      provider spec) locally; confirm both drifts (A: analytes scale default, B: inverse-clause
      reshape) are resolved and no ERROR-level breaking changes remain on the touched surfaces.
    priority: must-have
    type: test
