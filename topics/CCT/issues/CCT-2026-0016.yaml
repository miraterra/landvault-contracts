tasks:
  - id: t1
    description: >-
      Add default: absolute to the scale query parameter schema on GET /areal/analytes/{analyteId}
      in consumer-openapi.yaml, matching the real provider default (api/api.go:242).
    status: open
    priority: must-have
    type: fix
  - id: t2
    description: >-
      Realign the inverse-targeting clause to the real merged backend: rename
      fieldMatchPercent->field_match_percent, fieldOptimized->field_optimized (snake_case). Correct
      field_match_percent to type:number, minimum:1, maximum:100 (was integer/0, backend is *float64
      validated 1-100). REMOVE the direction field entirely (op carries direction: >=/<=/</>).
      REMOVE the if/then/else conditional-required on Clause -- op+threshold are ALWAYS
      required/present, even on the optimized clause (backend overwrites threshold in place; never
      omitted). Rewrite the Clause/fieldOptimized description prose: op and threshold are never
      ignored -- delete the 'op/threshold are IGNORED... direction is the SOLE carrier' language.
    status: open
    priority: must-have
    type: fix
  - id: t3
    description: >-
      Replace the top-level solvedThreshold response field with the real shape: add
      computed_thresholds (open map, additionalProperties: {type: number}, keyed by analyte name --
      NOT a fixed-key object, backend type is map[string]float64) and target_match_percent (number)
      to SuitabilityData. Document the query.criteria[].clauses[].threshold echo as the aliasing
      side effect it really is (ref DATA-2026-0095).
    status: open
    priority: must-have
    type: fix
  - id: t4
    description: >-
      Add per-region analyteAverages and nonMatchingAnalyteAverages as open maps
      (additionalProperties: {type: number}) to SuitabilityResult, for both measured and predicted.
      Also add the analytesOfInterest request field (array of string, optional, camelCase per
      backend) to SuitabilityRequest -- it's the real, wired control surface for which extra
      analytes populate these two new average maps. While touching SuitabilityPredicted, decide and
      note whether to add the optional suppressed field there too (backend's shared
      SuitabilityResult always carries it) or explicitly document the omission -- don't leave it a
      silent gap.
    status: open
    priority: must-have
    type: feat
  - id: t5
    description: >-
      Sweep ALL of coverage-matrix.md's inverse-targeting references, not just tier-5 residue rows
      -- sections 2 (schema-coverage), 4 (REQ-* census), 7.1 (element-mapping table), 7.2
      (distinctness), 7.3 (granularity), and 7.5 (provisional markers) all name the old
      fieldMatchPercent/fieldOptimized/direction/solvedThreshold shape and must be updated to
      field_match_percent/field_optimized/computed_thresholds/target_match_percent/analyteAverages/nonMatchingAnalyteAverages.
      Section 7.5 currently states camelCase SPEC names are authoritative over snake_case -- replace
      with: the backend's snake_case fields (PR #148, mt-landvault-api main @ 8f5fac6) are the
      confirmed real shape. Rewrite residue rows R6/R7 to document the REAL first-wins multiplicity
      behavior: the backend does not reject >1 field_optimized:true clauses: it solves only the
      FIRST match, and every subsequent field_optimized:true clause is evaluated in the real filter
      using its literal, client-supplied (unsolved) threshold -- not simply ignored. Reference
      DATA-2026-0094 as the open upstream question.
    status: open
    priority: must-have
    type: docs
  - id: t6
    description: >-
      Update verify-consumer-openapi.mjs C9 assertions with explicit per-check disposition: DELETE
      C9-direction-clause-enum-default (field removed); REWRITE C9-solvedThreshold-placement to
      assert computed_thresholds (open map) + target_match_percent placement/shape on
      SuitabilityData; DELETE or INVERT C9-multi-optimized-400 to assert the first-wins behavior is
      documented (ref DATA-2026-0094) rather than asserting a rejection rule that doesn't exist. Add
      REQUIRED_REQ_TAGS/structural coverage for the new fields. Bump info.version from 0.3.0 to
      0.4.0 -- treat as a breaking bump for the inverse clause (field removal/rename, not purely
      additive), consistent with NFR-VER-1's additive-only tolerance for MINOR bumps.
    status: open
    priority: must-have
    type: chore
  - id: t7
    description: >-
      Rewrite the stale embedded examples and prose that contradict the new shape: the
